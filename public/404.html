<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>404 Not Found | penguin-pro</title>
		<meta name="description" content="penguin-pro 404 error page" />
		<meta name="googlebot" content="noindex, nofollow, nosnippet" />
		<base href="/" />
		<link rel="icon" type="image/jpeg" href="IMG_0739.jpeg" />
		<link rel="stylesheet" href="index.css" />
	</head>

	<body>
		<main class="main-container">
			<!-- ヘッダーエリア -->
			<div class="penguin-header">
				<div class="penguin-icon">🐧</div>
				<h1>404 Not Found</h1>
				<p class="subtitle">ページが見つかりませんでした</p>
			</div>

			<!-- エラーメッセージ・再登録ボタン -->
			<div class="error-container" style="margin-bottom: 25px;">
				<p id="uv-error"></p>
				<pre id="uv-error-code"></pre>
				<button id="uv-register-sw" value="Register service worker" style="margin-top: 15px; padding: 10px 20px; border-radius: 20px; border: none; background: #0284c7; color: white; cursor: pointer; font-family: inherit; font-weight: 500;">
					ServiceWorkerを再登録
				</button>
			</div>

			<!-- トップページに戻るボタン -->
			<a href="/" style="color: #0284c7; text-decoration: none; font-weight: 500; padding: 10px 22px; border: 1.5px solid #0284c7; border-radius: 24px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px); transition: all 0.2s;">
				← ホームに戻る
			</a>
		</main>

		<!-- 内部処理スクリプト（削除不可） -->
		<script src="uv/uv.bundle.js"></script>
		<script src="uv/uv.config.js"></script>
		<script src="register-sw.js"></script>
		<script src="error.js"></script>
	</body>
</html>
