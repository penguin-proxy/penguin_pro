<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>検索 | Search</title>
		<meta
			name="description"
			content="シンプルなウェブ検索ポータル"
		/>
		<link rel="shortcut icon" href="favicon.ico" />
		<link rel="stylesheet" href="index.css" />

		<script src="baremux/index.js"></script>
		<script src="uv/uv.bundle.js"></script>
		<script src="uv/uv.config.js"></script>
	</head>

	<body>
		<main class="main-container">
			<!-- 富士山イメージのヘッダーロゴ（テキストデザイン） -->
			<div class="fuji-header">
				<div class="fuji-icon">
					<span class="fuji-snow">▲</span>
				</div>
				<h1>検索</h1>
				<p class="subtitle">FUJI SEARCH PORTAL</p>
			</div>

			<!-- 検索フォーム（機能は完全維持） -->
			<form id="uv-form" class="search-form">
				<input
					id="uv-search-engine"
					value="https://www.google.com/search?q=%s"
					type="hidden"
				/>
				<div class="search-input-wrapper">
					<svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
						<path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
					</svg>
					<input
						id="uv-address"
						type="text"
						placeholder="URLを直接入力"
						autocomplete="off"
					/>
				</div>
			</form>

			<!-- エラー表示エリア -->
			<div class="error-container">
				<p id="uv-error"></p>
				<pre id="uv-error-code"></pre>
			</div>
		</main>

		<!-- 内部処理用フレーム＆スクリプト（削除不可） -->
		<iframe style="display: none" id="uv-frame"></iframe>
		<script src="register-sw.js"></script>
		<script src="search.js"></script>
		<script src="index.js"></script>
	</body>
</html>
